[package]
name = "arena-btreemap"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A BTreeMap that supports custom allocators on stable Rust, ported from std"
repository = "https://github.com/guan-tends/arena-btreemap"
keywords = ["btreemap", "arena", "allocator", "btree", "allocation"]
categories = ["data-structures", "memory-management", "no-std"]
readme = "README.md"

[dependencies]
allocator-api2 = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
bumpalo = { version = "3.20", features = ["allocator-api2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = ["allocator-api2/std"]
serde = ["dep:serde"]
# Enable this for no_std builds (alloc-only)
# Note: some functionality may be limited without std
no_std = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
